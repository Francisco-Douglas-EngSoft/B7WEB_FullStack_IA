<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Semantica</title>
</head>
<body>
    <h1>Texto de Maior titulo</h1>
    <h2>Texto de Titulo Secundario</h2>
    <h3>Texto de Titulo Terciario</h3>
    <h4>Texto de Titulo 4</h4>
    <h5>Texto de Titulo 5</h5>
    <h6>Texto de Titulo 6</h6>

    <p>Tag de Titulo</p>
    <p>A Tag strong deixa o texto em Negrito <strong>Negrito</strong></p>

    <script>
        const titulo = document.querySelector("h6");

            titulo.addEventListener("click", () => {
                titulo.style.color = "red";
            });
    </script>
</body>
</html>
