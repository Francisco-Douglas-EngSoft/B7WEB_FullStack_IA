<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar, inserir e remover elementos</title>
</head>
<body>
    <h1>Lista de tarefas</h1>
    <form id="formulario">
        <label for="tarefa">Nova tarefa:</label>
        <input id="tarefa" type="text" placeholder="Ex.: estudar JavaScript">
        <button type="submit">Adicionar</button>
    </form>

    <p id="mensagem" aria-live="polite"></p>
    <ul id="lista">
        <li>Tarefa de exemplo</li>
    </ul>

    <script src="./2.10_inseriElementos.js"></script>
</body>
</html>
